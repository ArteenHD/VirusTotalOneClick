name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check tag matches the project version
        if: github.event_name == 'push'
        run: |
          $tag = "${{ github.ref_name }}"
          $version = ([xml](Get-Content -Raw src/VirusTotalOneClick/VirusTotalOneClick.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($tag -ne "v$version") {
            throw "Tag '$tag' does not match project version 'v$version'."
          }

      - name: Run validation gate
        run: pwsh -NoProfile -File scripts/validate.ps1

      - name: Run packaging tests
        run: pwsh -NoProfile -File scripts/test-packaging.ps1

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        run: pwsh -NoProfile -File scripts/build-installer.ps1

      - name: Build portable package
        run: pwsh -NoProfile -File scripts/package-windows.ps1

      - name: Write installer checksum
        run: |
          $installer = "installer/output/VirusTotalOneClickSetup.exe"
          $stream = [System.IO.File]::OpenRead($installer)
          try {
              $sha = [System.Security.Cryptography.SHA256]::Create()
              try { $hash = [System.BitConverter]::ToString($sha.ComputeHash($stream)).Replace("-", "").ToLowerInvariant() }
              finally { $sha.Dispose() }
          }
          finally { $stream.Dispose() }
          "$hash  VirusTotalOneClickSetup.exe" | Set-Content -Path "$installer.sha256" -Encoding ascii

      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            installer/output/VirusTotalOneClickSetup.exe
            build/package/VirusTotalOneClick-win-x64.zip

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "installer/output/VirusTotalOneClickSetup.exe" `
            "installer/output/VirusTotalOneClickSetup.exe.sha256" `
            "build/package/VirusTotalOneClick-win-x64.zip" `
            "build/package/VirusTotalOneClick-win-x64.zip.sha256" `
            --title "${{ github.ref_name }}" `
            --generate-notes

      - name: Upload dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          if-no-files-found: error
          path: |
            installer/output/VirusTotalOneClickSetup.exe
            installer/output/VirusTotalOneClickSetup.exe.sha256
            build/package/VirusTotalOneClick-win-x64.zip
            build/package/VirusTotalOneClick-win-x64.zip.sha256
