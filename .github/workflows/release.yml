name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Check tag matches the project version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG
          $version = ([xml](Get-Content -Raw Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($tag -ne "v$version") {
            throw "Tag '$tag' does not match project version 'v$version'."
          }

      - name: Run validation gate
        run: pwsh -NoProfile -File scripts/validate.ps1

      - name: Run packaging tests
        run: pwsh -NoProfile -File scripts/test-packaging.ps1

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        run: pwsh -NoProfile -File scripts/build-installer.ps1

      - name: Build portable package
        run: pwsh -NoProfile -File scripts/package-windows.ps1 -SkipPublish

      - name: Write installer checksum
        run: |
          $installer = "installer/output/VirusTotalOneClickSetup.exe"
          $stream = [System.IO.File]::OpenRead($installer)
          try {
              $sha = [System.Security.Cryptography.SHA256]::Create()
              try { $hash = [System.BitConverter]::ToString($sha.ComputeHash($stream)).Replace("-", "").ToLowerInvariant() }
              finally { $sha.Dispose() }
          }
          finally { $stream.Dispose() }
          "$hash  VirusTotalOneClickSetup.exe" | Set-Content -Path "$installer.sha256" -Encoding ascii

      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: |
            installer/output/VirusTotalOneClickSetup.exe
            build/package/VirusTotalOneClick-win-x64.zip

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG
          $assets = @(
            "installer/output/VirusTotalOneClickSetup.exe",
            "installer/output/VirusTotalOneClickSetup.exe.sha256",
            "build/package/VirusTotalOneClick-win-x64.zip",
            "build/package/VirusTotalOneClick-win-x64.zip.sha256"
          )

          # A rerun of a previous tag push must not fail just because the
          # release already exists: reuse it and replace its assets instead.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          }
          else {
            gh release create $tag @assets --title $tag --generate-notes
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Publishing the release failed with exit code $LASTEXITCODE."
          }

      - name: Upload dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dry-run
          if-no-files-found: error
          path: |
            installer/output/VirusTotalOneClickSetup.exe
            installer/output/VirusTotalOneClickSetup.exe.sha256
            build/package/VirusTotalOneClick-win-x64.zip
            build/package/VirusTotalOneClick-win-x64.zip.sha256
