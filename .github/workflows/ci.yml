name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Run validation gate
        run: pwsh -NoProfile -File scripts/validate.ps1

  commit-lint:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Lint commit messages
        run: pwsh -NoProfile -File scripts/lint-commit-range.ps1 -BaseSha "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}" -HeadSha "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

  package-tests:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run packaging tests
        run: pwsh -NoProfile -File scripts/test-packaging.ps1
