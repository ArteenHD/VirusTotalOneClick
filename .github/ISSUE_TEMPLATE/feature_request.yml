name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation where the app falls short, rather than a specific implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Heads up: this project keeps a deliberately narrow scope — right-click → VirusTotal, done well. Requests that grow it into a general security suite will likely be declined, kindly.
